{{- $url := .Destination -}}
{{- if or (hasPrefix $url "http://") (hasPrefix $url "https://") -}}
<img src="{{ $url }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} />
{{- else -}}
{{- $cleanUrl := strings.TrimPrefix "/static/" $url -}}
{{- $cleanUrl = strings.TrimPrefix "static/" $cleanUrl -}}
<img src="{{ $cleanUrl | relURL }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} />
{{- end -}}
